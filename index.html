<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Letterboxd - Pesquisa</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1 class="logo-title">videodrome</h1>
           <div id="hero-slider">
            <img src="images/carlitosway.webp" alt="Filme em destaque 1" class="slide active">
             <img src="images/eyes-widde-shut.webp" alt="Filme em destaque 2" class="slide">
             <img src="images/phantom.jpg" alt="Filme em destaque 3" class="slide">
           </div>
           
            <form id="form-pesquisa">
                <input type="text" id="input-pesquisa" placeholder="Pesquisar filmes...">
                <button type="submit">Buscar</button>
            </form>
        </header>

        <main id="container-resultados">
            <p class="placeholder-text">Digite o nome de um filme para começar.</p>
        </main>
    </div>

    <script src="search.js"></script>
</body>
</html>
